name: Mac app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release from this run
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    name: Package CreateMeter.app (Apple Silicon)
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Package arm64 dmg and zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          # Do not read secrets.CSC_*. Missing/blank secrets become "" and
          # electron-builder 26 treats any defined CSC_LINK as a cert path:
          # path.resolve(repo, "") is the repo dir → "createmeter not a file".
          for var in CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD WIN_CSC_LINK CSC_NAME; do
            unset "$var" || true
          done
          npm run icons
          env -u CSC_LINK -u CSC_KEY_PASSWORD -u CSC_INSTALLER_LINK -u CSC_INSTALLER_KEY_PASSWORD -u WIN_CSC_LINK -u CSC_NAME \
            npm run dist

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: CreateMeter-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

      - name: Read app version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          name: CreateMeter ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
