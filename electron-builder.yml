appId: com.foundersschool.createmeter
productName: CreateMeter
copyright: Copyright © Founders School
directories:
  output: release
files:
  - out/**/*
  - resources/**/*
executableName: CreateMeter
extraMetadata:
  name: createmeter
  productName: CreateMeter
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Skip signing entirely. Empty CSC_LINK is treated as a cert path ("not a file").
  identity: null
  forceCodeSigning: false
  notarize: false
  extendInfo:
    LSUIElement: true
    CFBundleName: CreateMeter
    CFBundleDisplayName: CreateMeter
    CFBundleIdentifier: com.foundersschool.createmeter
    NSAppleEventsUsageDescription: CreateMeter reads the active browser tab so sites like GitHub can count as creating and YouTube as consuming.
extraResources:
  - from: resources
    to: resources
publish:
  provider: github
  owner: Founders-School
  repo: createmeter
